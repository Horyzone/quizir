name: CI - Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test & Quality Checks
    runs-on: ubuntu-latest

    env:
      MIX_ENV: test
      POSTGRES_USER: quizir
      POSTGRES_PASSWORD: quizir
      POSTGRES_DB: quizir_test
      POSTGRES_HOST: 127.0.0.1

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quizir
          POSTGRES_PASSWORD: quizir
          POSTGRES_DB: quizir_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir and Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18'
          otp-version: '27'

      - name: Restore dependencies and build cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-otp27-elixir1.18-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-otp27-elixir1.18-

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Fetch dependencies
        run: mix deps.get

      - name: Check code formatting
        run: mix format --check-formatted

      - name: Compile dependencies and application
        run: mix compile --warnings-as-errors

      - name: Set up database
        run: |
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: Run test suite
        run: mix test
