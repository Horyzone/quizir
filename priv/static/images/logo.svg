<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Dégradé de fond Quizir : Indigo -> Violet -> Rose/Fuchsia -->
    <linearGradient id="qz-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <!-- Dégradé énergétique or de l'éclair -->
    <linearGradient id="qz-spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Ombre douce pour faire ressortir le sigle -->
    <filter id="qz-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.8" flood-color="#0F172A" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Fond squircle avec dégradé Quizir -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#qz-bg)" />
  <!-- Liseré supérieur subtil -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="15.5" fill="none" stroke="white" stroke-width="1.2" stroke-opacity="0.22" />

  <!-- 4 pastilles des 4 choix de réponse aux 4 coins -->
  <circle cx="10.5" cy="10.5" r="2.2" fill="#EF4444" />
  <circle cx="53.5" cy="10.5" r="2.2" fill="#3B82F6" />
  <circle cx="10.5" cy="53.5" r="2.2" fill="#10B981" />
  <circle cx="53.5" cy="53.5" r="2.2" fill="#F59E0B" />

  <!-- Sigle central : Anneau blanc pur + Point d'interrogation + Éclair queue -->
  <g filter="url(#qz-shadow)">
    <!-- Anneau du Q parfaitement rond -->
    <path
      fill-rule="evenodd"
      clip-rule="evenodd"
      d="M31 13
         C21.059 13 13 21.059 13 31
         C13 40.941 21.059 49 31 49
         C40.941 49 49 40.941 49 31
         C49 21.059 40.941 13 31 13 Z
         M31 20.2
         C25.035 20.2 20.2 25.035 20.2 31
         C20.2 36.965 25.035 41.8 31 41.8
         C36.965 41.8 41.8 36.965 41.8 31
         C41.8 25.035 36.965 20.2 31 20.2 Z"
      fill="white"
    />

    <!-- Point d'interrogation au centre -->
    <path
      d="M27.5 25.5
         C27.5 23.3 29.1 21.8 31 21.8
         C32.9 21.8 34.5 23.3 34.5 25.5
         C34.5 27.2 33.3 28.5 32.2 29.5
         C31.4 30.3 31 31.2 31 32.5
         L31 33"
      stroke="white"
      stroke-width="3.4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <circle cx="31" cy="37.5" r="1.9" fill="white" />

    <!-- Éclair énergétique qui forme la queue du Q -->
    <path
      d="M36 36.5 L46 41 L43 42.8 L48.5 48.5 L42.8 46 L44 43 L36.5 39 Z"
      fill="url(#qz-spark)"
      stroke="white"
      stroke-width="1"
      stroke-linejoin="round"
    />
  </g>
</svg>
